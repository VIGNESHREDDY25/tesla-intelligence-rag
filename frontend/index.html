<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tesla Intelligence</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Tesla Intelligence</h1>

            <p>
                AI-powered research assistant for Tesla company reports.
            </p>
        </header>


        <main class="chat-box">

            <div class="question-area">

                <input
                    type="text"
                    id="question"
                    placeholder="Ask a question about Tesla..."
                >

                <button id="askButton">
                    Ask
                </button>

            </div>


            <div class="section">

                <h2>Answer</h2>

                <div id="answer">
                    Your answer will appear here.
                </div>

            </div>


            <div class="section">

                <h2>Sources</h2>

                <div id="sources">
                    Sources will appear here.
                </div>

            </div>

        </main>

    </div>

    <script src="script.js"></script>
</body>

</html>
